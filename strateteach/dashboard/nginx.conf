server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Phase 2C-A · M5 — single-origin: proxy the StrateTeach API + Praxis functions through nginx so the
    # browser only ever talks to this origin (no CORS). Frontend uses relative bases (VITE_API_BASE="",
    # VITE_PRAXIS_FUNCTIONS_BASE="/pfn"). The trailing (/|$) keeps the API /praxis/ distinct from the SPA
    # route /praxis-connect.
    location ~ ^/(auth|praxis|exchange|portfolio|signals|autopilots|bots|strategy|runs|billing|meta|analytics|paper|social|reels|telegram|whatsapp|design|legal|portal|pm|mgmt|finance|employees|university|audit|layout|review|requests|healthz|v1)(/|$) {
        proxy_pass http://backend:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 120s;
    }
    # Praxis Edge functions (host Supabase, 54321) via host.docker.internal.
    location /pfn/ {
        proxy_pass http://host.docker.internal:54321/functions/v1/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # SPA fallback: serve index.html for any client-side route.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html must NEVER be cached — it's the pointer to the content-hashed
    # JS/CSS bundles. If it's cached, browsers keep loading an OLD build (old
    # chunk hashes) after a deploy, so fixes never reach users until the cache
    # expires. no-store/must-revalidate makes every deploy take effect on the
    # next load. The hashed assets it points to are still cached aggressively.
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        expires -1;
    }

    # The /structure/ click-through mockup is a standalone review artifact that gets
    # frequent label/layout tweaks. Serve it no-store so reviewers always get the
    # freshly deployed HTML (it is NOT a content-hashed asset, so a heuristically
    # cached copy would otherwise keep showing an old version — exactly the "still
    # shows the old label" problem). try_files keeps it served as the static file
    # (never the SPA index fallback).
    # `^~` so this prefix WINS over the image regex below — everything under /structure/
    # (including any .png/.svg in the mockup) stays no-store, preserving the "always fresh
    # review artifact" guarantee.
    location ^~ /structure/ {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        expires -1;
        try_files $uri $uri/ /structure/index.html;
    }

    # The /qa/ kit (standalone QA widget + setup guide + code page) is a static review artifact
    # served straight from public/qa/ — NOT the SPA. `^~` wins over the SPA catch-all AND the image
    # regex below, so /qa/ resolves to /qa/index.html and /qa/*.tsx|*.md serve as their real files
    # (never the SPA index fallback). no-store so a phone always gets the freshly deployed version.
    location ^~ /qa/ {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        expires -1;
        try_files $uri $uri/ /qa/index.html;
    }

    # The /glass/ page (liquid-glass treatment OPTIONS for Dan to pick from) is a
    # self-contained static preview served straight from public/glass/ — NOT the SPA.
    # `^~` wins over the SPA catch-all so /glass/ resolves to /glass/index.html.
    # no-store so Dan always sees the freshly deployed options.
    location ^~ /glass/ {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        expires -1;
        try_files $uri $uri/ /glass/index.html;
    }

    # A private, TOKEN-GATED governance document (owners-only architecture/decision record)
    # served straight from public/decision-<token>/ — NOT the SPA. The token path is
    # unguessable and is NOT linked from anywhere in the app; `^~` wins over the SPA catch-all
    # so the token dir resolves to its own index.html (a wrong sub-path 404s here instead of
    # leaking the app shell). no-store + noindex so this sensitive doc is never left in HTTP
    # caches or indexed by a crawler.
    location ^~ /decision-5n3vawomgakx20yf/ {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        expires -1;
        try_files $uri $uri/ /decision-5n3vawomgakx20yf/index.html;
    }

    # Companion token-gated doc: the Phase 1 isolated-execution-service technical spec
    # (owners + Oren). Same treatment as the decision record above — unguessable token path,
    # not linked anywhere, served static (not the SPA fallback), no-store + noindex.
    location ^~ /phase1-0uh0et4xp3mfyzz0/ {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        expires -1;
        try_files $uri $uri/ /phase1-0uh0et4xp3mfyzz0/index.html;
    }

    # Third token-gated doc: the management-system mapping (SheraCore pattern → StrateTeach),
    # owners-only. Same treatment as the two docs above — unguessable token path, not linked
    # anywhere, served static (not the SPA fallback), no-store + noindex.
    location ^~ /mgmt-m6b94lpnyhipmtws/ {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        expires -1;
        try_files $uri $uri/ /mgmt-m6b94lpnyhipmtws/index.html;
    }

    # Fourth token-gated doc: the regulatory-compliance summary (Raz meeting →
    # technical/product implications), owners-only. Same treatment as the docs
    # above — unguessable token path, not linked anywhere, static, no-store + noindex.
    location ^~ /reg-2k0w2vm73pt3q0yf/ {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        expires -1;
        try_files $uri $uri/ /reg-2k0w2vm73pt3q0yf/index.html;
    }

    # Focused SHARE one-pager for partners + Raz (changes + proposal + builder link).
    # Unguessable token path, not linked anywhere, static (not the SPA fallback),
    # no-store + noindex so this sensitive doc is never cached or indexed.
    location ^~ /share-bpvf2c6anby5wm0m/ {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        expires -1;
        try_files $uri $uri/ /share-bpvf2c6anby5wm0m/index.html;
    }

    # The service worker must NEVER be HTTP-cached — a stale sw.js would delay the
    # browser from noticing a new build and firing the update banner. Serving it
    # no-store means every update check re-fetches the freshly deployed worker.
    location = /sw.js {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        expires -1;
    }

    # Cache built assets aggressively (they are content-hashed by Vite, so a new
    # build produces new filenames — safe to cache forever).
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # ROOT static images + fonts (e.g. the ~820KB /logo-*.png wordmarks, favicons).
    # These live at the site root — NOT under /assets/ — so without this block the
    # catch-all `location /` served them with NO Cache-Control, and browsers re-fetched
    # the full 820KB logo on EVERY Home visit (~5s each time). Cache them long + immutable
    # so the 2nd+ visit is instant. They are not content-hashed, so the app appends a
    # stable ?v=LOGO_VERSION query (see Home.tsx) as the controlled cache-bust when art
    # changes. The `= /index.html`, `= /sw.js`, and `^~ /structure/` rules above still win
    # for their paths (exact/`^~` matches take precedence over this regex).
    location ~* \.(?:png|jpe?g|gif|svg|webp|avif|ico|woff2?|ttf|otf)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
