<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="robots" content="noindex, nofollow" />
<title>StrateTeach · מבנה מסכים (Mockup)</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700;800;900&family=Heebo:wght@400;700;900&display=swap" rel="stylesheet" />
<style>
  /* ── StrateTeach structure mockup — standalone, NOT the real app. ─────────────
     Palette tokens mirror dashboard/src/theme.ts (Navy / Peach / Nude / Sea).
     Everything below is self-contained: inline CSS + vanilla JS, no build deps. */
  :root{
    --bg:#0A1B4D; --surface:#12296B; --surface2:#1E3C93; --line:#3A72DE;
    --text:#EFF4FF; --muted:#BDCEF3; --faint:#8CA2D8;
    --gold:#2E7BFF; --accent:#5EAF73; --blue:#5AA0FF; --gain:#5EAF73; --loss:#F0616D;
    --btn-bg:#2E7BFF; --btn-bd:#205ab3; --btn-ink:#ffffff; --title-ink:#2E7BFF;
    --glass-bd:rgba(255,255,255,0.30);
    --accent-grad:linear-gradient(140deg,#E4F0FF 0%,#B9D4F8 20%,#8AB4F2 40%,#5A90EA 60%,#2E7BFF 80%,#1B4FC0 100%);
    --title-grad:linear-gradient(140deg,#E4F0FF 0%,#8AB4F2 45%,#1B4FC0 100%);
    --glass:linear-gradient(150deg,rgba(80,110,190,0.46) 0%,rgba(18,41,107,0.20) 55%,rgba(30,60,147,0.34) 100%);
    --glass-tint:linear-gradient(146deg,rgba(46,123,255,0.36) 0%,rgba(90,160,255,0.18) 40%,rgba(30,60,147,0.34) 100%);
    --glass-hi:inset 0 1.5px 0 rgba(255,255,255,0.42), inset 0 -11px 24px -13px rgba(6,16,40,0.5);
    --barh:118px;   /* mockup control dock height */
    --tabh:58px;    /* real app bottom tab bar height */
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;min-height:100%}
  /* base fill on <html> (like the real app) so any area beyond <body> stays on-skin */
  html{background:var(--bg);transition:background .45s ease}
  body{
    font-family:'Rubik','Heebo',system-ui,-apple-system,'Segoe UI',sans-serif;
    color:var(--text);min-height:100vh;
    background:linear-gradient(152deg,var(--surface2) 0%,var(--bg) 50%,var(--bg) 100%);
    transition:background .45s ease,color .35s ease;
    -webkit-font-smoothing:antialiased;
  }
  body.light{background:linear-gradient(170deg,var(--surface) 0%,var(--bg) 55%)}
  #app{max-width:520px;margin:0 auto;padding:14px 15px calc(var(--barh) + var(--tabh) + 26px);min-height:100vh}

  /* top bar: back + breadcrumb */
  .topbar{display:flex;align-items:center;gap:10px;margin-bottom:16px;min-height:38px}
  .back{display:inline-flex;align-items:center;gap:5px;background:var(--surface2);border:1px solid var(--line);
    color:var(--muted);border-radius:11px;padding:8px 12px;font-size:12.5px;font-weight:700;cursor:pointer;
    font-family:inherit;flex-shrink:0}
  .back:active{transform:scale(.96)}
  .back svg{transition:transform .2s}
  html[dir=ltr] .back svg{transform:scaleX(-1)}
  .crumb{font-size:11.5px;color:var(--faint);font-weight:600;display:flex;flex-wrap:wrap;align-items:center;gap:4px;min-width:0}
  .crumb b{color:var(--muted)}
  .crumb .sep{opacity:.5}

  /* title lockup — skin-adaptive gradient wordmark */
  .titlewrap{text-align:center;margin-bottom:16px;animation:rise .4s cubic-bezier(.22,.61,.36,1) both}
  .lockup{margin:0;font-weight:900;font-size:clamp(23px,7.4vw,33px);line-height:1.08;
    letter-spacing:.14em;text-transform:uppercase;
    background:var(--title-grad);-webkit-background-clip:text;background-clip:text;
    -webkit-text-fill-color:transparent;color:transparent;
    display:inline-flex;align-items:center;justify-content:center;gap:11px;padding-inline-start:.14em}
  html[dir=rtl] .lockup{letter-spacing:.04em}
  .lockup .tchip{display:inline-flex;align-items:center;justify-content:center;width:38px;height:38px;border-radius:12px;
    -webkit-text-fill-color:initial;color:var(--btn-ink);background:var(--accent-grad);box-shadow:var(--glass-hi);flex-shrink:0}
  .subtitle{margin:8px auto 0;font-size:12.8px;color:var(--muted);max-width:400px;line-height:1.45}

  /* section label */
  .slabel{display:flex;align-items:center;gap:8px;margin:2px 2px 9px;font-size:11px;font-weight:800;
    letter-spacing:.06em;text-transform:uppercase;color:var(--faint)}
  .slabel::before{content:"";width:3px;height:12px;border-radius:2px;background:var(--accent-grad);flex-shrink:0}

  /* quick panel — row of short shortcut pills */
  .panel{background:var(--glass);border:1px solid var(--glass-bd);border-radius:16px;padding:10px;margin-bottom:16px;
    backdrop-filter:blur(20px) saturate(1.6);-webkit-backdrop-filter:blur(20px) saturate(1.6);box-shadow:var(--glass-hi)}
  .qrow{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:1px}
  .qrow::-webkit-scrollbar{display:none}
  .qpill{flex:0 0 auto;display:inline-flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;
    min-width:66px;padding:9px 9px;background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:13px;
    color:var(--text);font-size:10.6px;font-weight:700;cursor:pointer;font-family:inherit;line-height:1.1;white-space:nowrap}
  body.light .qpill{background:rgba(0,0,0,.03)}
  .qpill:active{transform:scale(.95)}
  .qpill svg{color:var(--gold)}
  .qpill .qi{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;background:var(--surface2)}

  /* central buttons */
  .centers{display:grid;gap:12px;margin-bottom:18px}
  .centers.n1{grid-template-columns:1fr}
  .centers.n2{grid-template-columns:1fr 1fr}
  .centers.n3{grid-template-columns:1fr 1fr}
  /* 2-button SIZE HIERARCHY (Home + inner hubs): primary = the bigger/wider tile,
     secondary = clearly smaller. Dan: Trading is the big primary, Portal secondary. */
  .centers.hier2{grid-template-columns:1.42fr 0.86fr;align-items:stretch}
  .centers.hier2 .center.primary{min-height:158px}
  .centers.hier2 .center.primary .cico{width:54px;height:54px}
  .centers.hier2 .center.primary .clab{font-size:19px}
  .centers.hier2 .center.secondary{min-height:130px}
  .center{position:relative;border:none;cursor:pointer;font-family:inherit;border-radius:20px;padding:16px 14px;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;text-align:center;
    min-height:120px;transition:transform .16s ease,box-shadow .2s ease;overflow:hidden}
  .center:active{transform:translateY(2px) scale(.985)}
  .center.big{grid-column:1 / -1;min-height:132px}
  .center.primary{background:var(--accent-grad);color:var(--btn-ink);box-shadow:0 14px 34px -14px var(--gold),var(--glass-hi)}
  .center.secondary,.center.tertiary{background:var(--glass);border:1.6px solid var(--gold);color:var(--text);
    backdrop-filter:blur(18px) saturate(1.5);-webkit-backdrop-filter:blur(18px) saturate(1.5);box-shadow:var(--glass-hi)}
  .center .cico{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;flex-shrink:0}
  .center.primary .cico{background:rgba(255,255,255,.22);color:var(--btn-ink)}
  .center.secondary .cico,.center.tertiary .cico{background:var(--accent-grad);color:var(--btn-ink);box-shadow:var(--glass-hi)}
  .center.big .cico{width:52px;height:52px}
  .center .clab{font-size:16px;font-weight:900;line-height:1.12}
  .center.big .clab{font-size:18.5px}
  .center .csub{font-size:11px;font-weight:600;opacity:.82;line-height:1.25;max-width:88%}
  .center .cbadge{position:absolute;top:9px;inset-inline-end:10px;font-size:8.5px;font-weight:900;letter-spacing:.05em;
    padding:3px 7px;border-radius:8px;background:rgba(255,255,255,.2);color:inherit;text-transform:uppercase}
  .center.warn{border-color:var(--loss)}
  .center.warn .cico{background:linear-gradient(140deg,var(--loss),#b52b38)}

  /* tiles grid (service view) */
  .tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
  .tiles.g3{grid-template-columns:1fr 1fr 1fr}
  .tile{background:var(--glass);border:1px solid var(--glass-bd);border-radius:16px;padding:13px 11px;cursor:pointer;
    font-family:inherit;color:var(--text);display:flex;flex-direction:column;align-items:flex-start;gap:8px;text-align:start;
    box-shadow:var(--glass-hi);transition:transform .15s;min-height:92px}
  .tile:active{transform:scale(.97)}
  .tile .tico{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;background:var(--accent-grad);
    color:var(--btn-ink);box-shadow:var(--glass-hi)}
  .tile .tt{font-size:13px;font-weight:800;line-height:1.15}
  .tile .ts{font-size:10.5px;color:var(--muted);font-weight:600;line-height:1.25}
  .tile.ex{align-items:center;text-align:center;min-height:78px;justify-content:center;gap:6px}
  .tile.ex .exb{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-weight:900;font-size:15px;
    background:var(--surface2);color:var(--gold);border:1px solid var(--line)}

  /* rows (service view list) */
  .rows{display:flex;flex-direction:column;gap:9px;margin-bottom:16px}
  .row{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:14px;
    padding:13px 14px;cursor:pointer;font-family:inherit;color:var(--text);text-align:start;width:100%}
  .row:active{transform:scale(.99)}
  .row .rico{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;flex-shrink:0;
    background:var(--surface2);color:var(--gold)}
  .row .rmid{flex:1;min-width:0;display:flex;flex-direction:column}
  .row .rt{font-size:13.5px;font-weight:800;line-height:1.2}
  .row .rm{font-size:11px;color:var(--muted);font-weight:600;margin-top:2px;line-height:1.3}
  .row .rchip{font-size:9.5px;font-weight:900;letter-spacing:.03em;padding:4px 8px;border-radius:8px;flex-shrink:0;white-space:nowrap}
  .row .rarrow{color:var(--faint);flex-shrink:0}
  html[dir=rtl] .row .rarrow{transform:scaleX(-1)}

  /* inline toggle (feature connect) */
  .tog{width:42px;height:24px;border-radius:999px;background:var(--surface2);border:1px solid var(--line);position:relative;
    flex-shrink:0;transition:background .2s}
  .tog i{position:absolute;top:2px;inset-inline-start:2px;width:18px;height:18px;border-radius:50%;background:var(--faint);
    transition:all .2s}
  .tog.on{background:var(--gold)}
  .tog.on i{inset-inline-start:calc(100% - 20px);background:#fff}

  /* note */
  .note{display:flex;gap:9px;align-items:flex-start;background:rgba(255,255,255,.05);border:1px solid var(--line);
    border-radius:13px;padding:11px 12px;margin-bottom:16px;font-size:11.5px;color:var(--muted);line-height:1.5}
  body.light .note{background:rgba(0,0,0,.03)}
  .note.warn{border-color:var(--loss);background:rgba(240,97,109,.09);color:var(--text)}
  .note svg{color:var(--gold);flex-shrink:0;margin-top:1px}
  .note.warn svg{color:var(--loss)}

  /* bottom panel — persistent secondary shortcuts */
  .bpanel{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;padding-top:6px;margin-top:4px}
  .bpill{display:inline-flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);
    border-radius:11px;padding:9px 13px;color:var(--muted);font-size:11.5px;font-weight:700;cursor:pointer;font-family:inherit}
  .bpill:active{transform:scale(.96)}
  .bpill svg{color:var(--gold)}

  .kv{font-size:11px;color:var(--faint);text-align:center;margin:20px 0 4px;font-weight:600}

  /* pinned control dock */
  .dock{position:fixed;left:0;right:0;bottom:0;z-index:60;background:rgba(10,18,40,.86);
    backdrop-filter:blur(16px) saturate(1.4);-webkit-backdrop-filter:blur(16px) saturate(1.4);
    border-top:1px solid var(--glass-bd);padding:8px 12px calc(8px + env(safe-area-inset-bottom));
    box-shadow:0 -8px 24px -12px rgba(0,0,0,.5)}
  body.light .dock{background:rgba(255,255,255,.82)}
  .dockmax{max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:7px}
  .dockrow{display:flex;align-items:center;gap:7px}
  .dockrow .lab{font-size:9px;font-weight:900;letter-spacing:.05em;text-transform:uppercase;color:var(--faint);
    width:34px;flex-shrink:0}
  .seg{display:flex;gap:4px;flex:1;background:var(--surface2);border:1px solid var(--line);border-radius:11px;padding:3px}
  .seg button{flex:1;border:none;background:transparent;color:var(--muted);font-family:inherit;font-size:11px;font-weight:800;
    padding:6px 4px;border-radius:8px;cursor:pointer;white-space:nowrap}
  .seg button.on{background:var(--accent-grad);color:var(--btn-ink);box-shadow:var(--glass-hi)}
  .skins{display:flex;gap:6px;flex:1}
  .sw{flex:1;height:30px;border-radius:9px;border:2px solid transparent;cursor:pointer;position:relative;
    display:flex;align-items:center;justify-content:center;font-size:9.5px;font-weight:900;color:#fff;
    text-shadow:0 1px 2px rgba(0,0,0,.5)}
  .sw.on{border-color:#fff;box-shadow:0 0 0 2px rgba(255,255,255,.3)}
  .minibtn{border:1px solid var(--line);background:var(--surface2);color:var(--muted);border-radius:9px;
    padding:6px 9px;font-family:inherit;font-size:10.5px;font-weight:800;cursor:pointer;white-space:nowrap;flex-shrink:0}
  .minibtn.act{background:var(--accent-grad);color:var(--btn-ink);border-color:transparent}

  /* editable-shortcuts pencil (sits in the top shortcuts panel) */
  .qedit{flex:0 0 auto;display:inline-flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;min-width:54px;
    padding:9px 8px;background:transparent;border:1px dashed var(--glass-bd);border-radius:13px;color:var(--muted);
    font-size:10px;font-weight:800;cursor:pointer;font-family:inherit;white-space:nowrap}
  .qedit .qi{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;background:var(--surface2);color:var(--gold)}
  .slabelrow{display:flex;align-items:center;justify-content:space-between;gap:8px}
  .slabelrow .hint{font-size:9.5px;font-weight:700;color:var(--faint)}
  .scedit-btn{display:inline-flex;align-items:center;gap:5px;background:var(--surface2);border:1px solid var(--gold);
    color:var(--gold);border-radius:9px;padding:5px 11px;font-family:inherit;font-size:11px;font-weight:800;cursor:pointer;
    text-transform:none;letter-spacing:0}
  .scedit-btn:active{transform:scale(.95)}
  .qedit-tile{color:var(--muted)!important;border-style:dashed!important}

  /* "עוד במערכת / More" — top gateway entry that opens the extras child screen */
  .morebtn{display:flex;align-items:center;gap:9px;width:100%;margin-bottom:18px;padding:12px 15px;
    background:var(--glass);border:1px solid var(--glass-bd);border-radius:14px;color:var(--text);font-family:inherit;
    font-size:13px;font-weight:800;cursor:pointer;box-shadow:var(--glass-hi)}
  .morebtn:active{transform:scale(.99)}
  .morebtn svg{color:var(--gold);flex-shrink:0}
  .morebtn .mchev{margin-inline-start:auto;color:var(--faint)}
  html[dir=rtl] .morebtn .mchev{transform:scaleX(-1)}

  /* rows ⇄ tiles view toggle (list header) */
  .listhead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:2px 2px 11px}
  .vtog{display:inline-flex;gap:2px;background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:3px;flex-shrink:0}
  .vtog button{display:inline-flex;align-items:center;gap:5px;border:none;background:transparent;color:var(--muted);
    font-family:inherit;font-size:11px;font-weight:800;padding:5px 10px;border-radius:7px;cursor:pointer}
  .vtog button.on{background:var(--accent-grad);color:var(--btn-ink);box-shadow:var(--glass-hi)}

  /* real app bottom tab bar — pinned ABOVE the mockup control dock */
  .tabbar{position:fixed;inset-inline:0;bottom:var(--barh);z-index:50;display:flex;align-items:stretch;
    background:var(--surface);border-top:1px solid var(--line);box-shadow:0 -8px 24px -16px rgba(0,0,0,.45)}
  .tabbar button{flex:1;min-width:0;min-height:var(--tabh);display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:3px;background:none;border:none;cursor:pointer;font-family:inherit;position:relative;padding:8px 4px 7px;color:var(--muted)}
  .tabbar button .tacc{position:absolute;top:0;left:50%;transform:translateX(-50%);width:0;height:3px;border-radius:3px;
    background:var(--gold);transition:width .2s}
  .tabbar button.on .tacc{width:26px}
  .tabbar button.on{color:var(--text)}
  .tabbar .tlab{font-size:10.5px;font-weight:600;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
  .tabbar button.on .tlab{font-weight:800}

  /* shortcuts edit sheet */
  .ovl{position:fixed;inset:0;z-index:80;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;justify-content:center;
    animation:ovlfade .2s ease both}
  @keyframes ovlfade{from{opacity:0}to{opacity:1}}
  .ovlcard{width:100%;max-width:520px;max-height:82vh;overflow-y:auto;background:var(--surface);border:1px solid var(--glass-bd);
    border-radius:20px 20px 0 0;padding:16px 16px calc(20px + var(--barh));animation:ovlup .28s cubic-bezier(.22,.61,.36,1) both}
  @keyframes ovlup{from{transform:translateY(30px);opacity:.6}to{transform:translateY(0);opacity:1}}
  .ovlhead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:5px}
  .ovlhead h3{margin:0;font-size:16.5px;font-weight:900;color:var(--text)}
  .ovlhead .done{background:var(--accent-grad);color:var(--btn-ink);border:none;border-radius:10px;padding:8px 16px;
    font-family:inherit;font-weight:800;font-size:12.5px;cursor:pointer;box-shadow:var(--glass-hi)}
  .ovlsub{font-size:11.5px;color:var(--muted);margin:0 0 13px;line-height:1.4}
  .ovlgrid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
  .ovlopt{display:flex;align-items:center;gap:9px;padding:11px 12px;background:var(--surface2);border:1px solid var(--line);
    border-radius:12px;color:var(--text);font-family:inherit;font-size:12.5px;font-weight:700;cursor:pointer;text-align:start}
  .ovlopt .oico{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:var(--surface);color:var(--gold);flex-shrink:0}
  .ovlopt.sel{border-color:var(--gold);background:var(--glass-tint)}
  .ovlopt.sel .oico{background:var(--accent-grad);color:var(--btn-ink)}
  .ovlopt.dis{opacity:.42;cursor:not-allowed}
  .ovlopt .ochk{margin-inline-start:auto;color:var(--gold);flex-shrink:0}

  /* "עוד במערכת" chip — lives INSIDE the shortcuts row (one of the shortcut buttons),
     styled as an accent chip so it reads as the gateway to more of the app. */
  .qpill.qmore{background:var(--glass-tint);border-color:var(--gold)}
  .qpill.qmore .qi{background:var(--accent-grad);color:var(--btn-ink)}

  /* Home-ONLY market ticker (real cycling taglines) */
  .ticker{overflow:hidden;white-space:nowrap;margin:-4px 0 15px;padding:7px 0;border-top:1px solid var(--line);
    border-bottom:1px solid var(--line);
    -webkit-mask:linear-gradient(90deg,transparent,#000 7%,#000 93%,transparent);
    mask:linear-gradient(90deg,transparent,#000 7%,#000 93%,transparent)}
  .ticker .tk{display:inline-flex;gap:20px;animation:tkscroll 24s linear infinite;padding-inline-start:20px;will-change:transform}
  .ticker .tk span{color:var(--gold);font-size:11px;font-weight:800;letter-spacing:.02em;text-shadow:0 0 8px var(--gold)}
  @keyframes tkscroll{from{transform:translateX(0)}to{transform:translateX(-50%)}}

  /* Home-ONLY portfolio / P&L card (real live↔demo toggle + source rows) */
  .pnlcard{background:var(--glass);border:1px solid var(--glass-bd);border-radius:16px;padding:13px;margin-bottom:16px;
    box-shadow:var(--glass-hi);backdrop-filter:blur(18px) saturate(1.5);-webkit-backdrop-filter:blur(18px) saturate(1.5)}
  .pnlcard .ph{display:flex;align-items:center;gap:8px;margin-bottom:11px}
  .pnlcard .pt{font-size:13px;font-weight:800;display:inline-flex;align-items:center;gap:7px;color:var(--text)}
  .pnlcard .pt svg{color:var(--gold)}
  .pmodes{display:flex;gap:6px;margin-inline-start:auto}
  .pmode{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);background:var(--surface2);color:var(--muted);
    border-radius:9px;padding:5px 9px;font-family:inherit;font-size:10px;font-weight:800;cursor:pointer;white-space:nowrap}
  .pmode.on-live{background:var(--loss);color:#fff;border-color:transparent}
  .pmode.on-demo{background:var(--blue);color:#fff;border-color:transparent}
  .ptotal{display:flex;align-items:baseline;gap:9px;margin-bottom:12px}

function hexToRgb(h){const m=h.replace("#","");const n=m.length===3?m.split("").map(c=>c+c).join(""):m;const i=parseInt(n,16);return[(i>>16)&255,(i>>8)&255,i&255];}
const toHex=v=>Math.max(0,Math.min(255,Math.round(v))).toString(16).padStart(2,"0");

function lighten(h,a){const[r,g,b]=hexToRgb(h);return`#${toHex(r+(255-r)*a)}${toHex(g+(255-g)*a)}${toHex(b+(255-b)*a)}`;}
function rgba(h,a){const[r,g,b]=hexToRgb(h);return`rgba(${r}, ${g}, ${b}, ${a})`;}
function relLum([r,g,b]){const f=v=>{v/=255;return v<=0.03928?v/12.92:Math.pow((v+0.055)/1.055,2.4);};return 0.2126*f(r)+0.7152*f(g)+0.0722*f(b);}

};
function tabFor(id){
  if(id==="more")id=state.moreParent||"home";
  if(id==="home")return "home";
  for(const k of Object.keys(TAB_MATCH))if(TAB_MATCH[k].includes(id))return k;
  return "";
}

/* Resolve a screen config by id — including the DYNAMIC "more" child, which shows
   the parent screen's secondary actions (what used to be the bottom panel) as a grid. */
function getCfg(id){
  if(id==="more"){
    const p=SCREENS[state.moreParent]?SCREENS[state.moreParent]():{title:T("מסך","Screen")};
    return {crumb:T("עוד במערכת","More"),icon:"layers",title:T("עוד במערכת","MORE"),
      sub:T("עוד מסכים ופעולות של המערכת בהקשר זה","More of the app's screens & actions for this context"),
      moreItems:(p.bottom||[]),parentTitle:p.title};
  }
  return SCREENS[id]();
}

/* The screen's MAIN list, normalized so it can render as EITHER rows or tiles.
   Each screen carries at most one of: rows · tiles · pilotTiles · accountRows · moreItems. */
function mainList(cfg){
  if(cfg.rows)return {kind:"rows",native:"rows",items:cfg.rows};
  if(cfg.accountRows)return {kind:"account",native:"rows",items:cfg.accountRows};
  if(cfg.tiles)return {kind:"tiles",native:"tiles",items:cfg.tiles};
  if(cfg.pilotTiles)return {kind:"pilot",native:"tiles",items:cfg.pilotTiles.map(p=>({badge:p.n,t:p.name,m:p.m}))};
  if(cfg.moreItems)return {kind:"more",native:"tiles",items:cfg.moreItems.map(b=>({ico:b.ico,t:b.lab,to:b.to,act:b.act}))};
  return null;
}

/* ── NAVIGATION ─────────────────────────────────────────────────────────────── */
function nav(id){if(id!=="more"&&!SCREENS[id])return;state.stack.push(id);render();window.scrollTo(0,0);}
function back(){if(state.stack.length>1){state.stack.pop();render();window.scrollTo(0,0);}}
function go(item){
  if(item.act==="lang"){toggleLang();return;}
  if(item.to)nav(item.to);
}

/* ── RENDER ─────────────────────────────────────────────────────────────────── */
function el(html){const d=document.createElement("div");d.innerHTML=html;return d.firstElementChild;}
function toneColor(t){return t==="gain"?"var(--gain)":t==="loss"?"var(--loss)":t==="blue"?"var(--blue)":"var(--gold)";}
function toneChip(t){const c=toneColor(t);return`background:${state.mode==='dark'?'rgba(255,255,255,.08)':'rgba(0,0,0,.05)'};color:${c};border:1px solid ${c}`;}

function render(){
  const id=state.stack[state.stack.length-1];
  const cfg=getCfg(id);
  const app=document.getElementById("app");
  const list=mainList(cfg);
  const view=list?(state.viewMode||list.native):null;   // rows ⇄ tiles (native until toggled)
  let h="";

  /* top bar: back + breadcrumb */
  h+=`<div class="topbar">`;
  if(state.stack.length>1)h+=`<button class="back" onclick="back()">${ic("chevron",16)}<span>${tt("חזרה","Back")}</span></button>`;
  const crumbs=state.stack.map((sid,i)=>{const c=getCfg(sid);const label=c.crumb?L(c.crumb):sid;
    return i===state.stack.length-1?`<b>${label}</b>`:`<span class="cn" data-cn="${i}">${label}</span>`;});
  h+=`<div class="crumb">${crumbs.join('<span class="sep">›</span>')}</div>`;
  h+=`</div>`;

  /* title lockup + subtitle */
  h+=`<div class="titlewrap">`;
  const tIcon=cfg.icon?`<span class="tchip">${ic(cfg.icon,20)}</span>`:"";
  h+=`<h1 class="lockup">${tIcon}<span>${cfg.wordmark?cfg.wordmark:L(cfg.title)}</span></h1>`;
  if(cfg.sub)h+=`<p class="subtitle">${L(cfg.sub)}</p>`;
  h+=`</div>`;

  /* HOME-only market ticker (real cycling taglines) */
  if(cfg.ticker&&cfg.ticker.length){
    const items=cfg.ticker.concat(cfg.ticker).map(s=>`<span>${L(s)} ✦</span>`).join("");
    h+=`<div class="ticker"><div class="tk">${items}</div></div>`;
  }

  h+=`<div class="fade">`;

  /* TOP: EDITABLE shortcuts panel — each user picks their own 5 (pencil to edit).
     "עוד במערכת" is ONE chip inside this row (not a separate entry) that opens the
     screen's extras child. Hidden on the dynamic "more" child itself. */
  if(id!=="more"){
    h+=`<div class="slabel slabelrow"><span>${tt("הקיצורים שלי","My shortcuts")} <span class="hint">· ${tt(state.shortcuts.length+"/5","up to 5")}</span></span><button class="scedit-btn" id="sc-edit">${ic("pencil",13)} ${tt("ערוך","Edit")}</button></div>`;
    h+=`<div class="panel"><div class="qrow">`;
    // "עוד במערכת" leads the row (always visible) — one chip that opens this screen's
    // extras child; then the user's up-to-5 shortcuts; then the edit tile.
    if(cfg.bottom&&cfg.bottom.length)
      h+=`<button class="qpill qmore" id="more-open"><span class="qi">${ic("layers",18)}</span>${tt("עוד במערכת","More")}</button>`;
    state.shortcuts.slice(0,MAX_SHORTCUTS).forEach((sid,i)=>{const s=catItem(sid);if(!s)return;
      h+=`<button class="qpill" data-sc="${i}"><span class="qi">${ic(s.ico,18)}</span>${L(s.lab)}</button>`;});
    h+=`<button class="qpill qedit-tile" id="sc-edit2"><span class="qi" style="background:transparent;border:1px dashed var(--glass-bd)">${ic("pencil",16)}</span>${tt("ערוך","Edit")}</button>`;
    h+=`</div></div>`;
  }

  /* MIDDLE: central buttons */
  if(cfg.centers&&cfg.centers.length){
    const n=cfg.centers.length;
    // equal → symmetric n2; two hierarchical buttons → asymmetric hier2 (bigger primary);
    // otherwise n1/n3 (n3 renders its first button full-width & big).
    const cls=cfg.equalCenters?"n2":(n===2?"hier2":("n"+Math.min(n,3)));
    h+=`<div class="centers ${cls}">`;
    cfg.centers.forEach((c,i)=>{
      let scls=c.size==="primary"||c.size==="big"?"primary":"secondary";
      let extra="";
      if(n===3&&i===0){extra="big";scls="primary";}
      if(cfg.equalCenters)scls=i===0?"primary":"secondary";
      if(c.warn)extra+=" warn";
      const badge=c.badge?`<span class="cbadge">${L(c.badge)}</span>`:"";
      h+=`<button class="center ${scls} ${extra}" data-c="${i}">${badge}<span class="cico">${ic(c.ico,24)}</span><span class="clab">${L(c.lab)}</span>${c.sub?`<span class="csub">${L(c.sub)}</span>`:""}</button>`;
    });
    h+=`</div>`;
  }

  /* HOME-only portfolio / P&L card — real live↔demo toggle + source rows. This is a
     HOME-specific panel (NOT copied to other screens; only the design STRUCTURE is
     shared, not Home's data). */
  if(cfg.pnl){
    const p=cfg.pnl, mode=state.pnlMode||"live", md=p.modes.find(m=>m.k===mode)||p.modes[0];
    const rows=(mode==="live"?p.live:p.demo)||[];
    h+=`<div class="pnlcard"><div class="ph"><span class="pt">${ic("wallet",16)} ${L(p.title)}</span><div class="pmodes">`;
    p.modes.forEach(m=>{h+=`<button class="pmode ${mode===m.k?("on-"+m.k):""}" data-pmode="${m.k}">${ic(m.k==="live"?"radio":"flask",12)} ${L(m.lab)}</button>`;});
    h+=`</div></div>`;
    h+=`<div class="ptotal"><span class="pamt" style="color:${mode==="live"?"var(--loss)":"var(--blue)"}">${L(md.amount)}</span><span class="plab">${L(p.totalLab)}</span></div>`;
    rows.forEach(r=>{const c=toneColor(r.tone);
      h+=`<div class="psrc"><span class="pico">${ic(r.ico,16)}</span><span class="psname">${L(r.name)}</span><span class="psbadge" style="${toneChip(r.tone)}">${L(r.badge)}</span><span class="psval" style="color:${c}">${L(r.val)}</span></div>`;});
    if(p.note)h+=`<div class="note" style="margin:8px 0 0">${ic("info",15)}<span>${L(p.note)}</span></div>`;
    h+=`</div>`;
  }

  /* exchange picker grid (special — not part of the rows/tiles toggle) */
  if(cfg.exchangeGrid){
    h+=`<div class="slabel">${tt("בחר בורסה","Pick an exchange")}</div>`;
    h+=`<div class="tiles g3">`;
    cfg.exchangeGrid.forEach((x,i)=>{
      h+=`<button class="tile ex" data-ex="${i}" style="${x.on?'border-color:var(--gold);box-shadow:0 0 0 2px var(--gold),var(--glass-hi)':''}"><span class="exb" ${x.on?'style="background:var(--accent-grad);color:var(--btn-ink);border:none"':''}>${x.letter}</span><span class="tt" style="font-size:11.5px">${x.name}</span></button>`;
    });
    h+=`</div>`;
  }

  /* MAIN service list — renders as ROWS or TILES with a header view toggle */
  if(list){
    const label=cfg.listLabel?L(cfg.listLabel)
      :list.kind==="account"?tt("חשבונות","Accounts")
      :list.kind==="pilot"?tt("הטייסים","The pilots")
      :list.kind==="more"?tt("פעולות","Actions")
      :tt("שירותים","Services");
    h+=`<div class="listhead"><span class="slabel" style="margin:0">${label}</span>`;
    h+=`<div class="vtog"><button data-view="rows" class="${view==="rows"?"on":""}">${ic("list",14)} ${tt("רשימה","Rows")}</button>`;
    h+=`<button data-view="tiles" class="${view==="tiles"?"on":""}">${ic("grid",14)} ${tt("ריבועים","Tiles")}</button></div></div>`;
    h+=renderList(list,view);
  }

  /* feature-connect toggles (special) */
  if(cfg.features){
    h+=`<div class="slabel">${tt("חבר לפיצ'רים","Connect to features")}</div>`;
    h+=`<div class="rows">`;
    cfg.features.forEach(f=>{
      const on=state.toggles[f.key];
      h+=`<div class="row" style="cursor:default"><span class="rico">${ic(f.ico,18)}</span><span class="rmid"><span class="rt">${L(f.lab)}</span><span class="rm">${on?tt("מחובר · יעבור להגדרות LIVE","Linked · goes to LIVE settings"):tt("כבוי","Off")}</span></span><button class="tog ${on?'on':''}" data-tog="${f.key}"><i></i></button></div>`;
    });
    h+=`</div>`;
    if(cfg.featuresNote)h+=`<div class="note">${ic("info",16)}<span>${L(cfg.featuresNote)}</span></div>`;
  }

  /* note */
  if(cfg.note)h+=`<div class="note ${cfg.noteWarn?'warn':''}">${ic(cfg.noteWarn?"shield":"info",16)}<span>${L(cfg.note)}</span></div>`;

  /* (bottom panel removed — extras now live behind the "More settings" top entry,
     and the app's real bottom TabBar is the single persistent bottom nav.) */

  h+=`<div class="kv">StrateTeach · ${tt("מבנה מסכים — הדגמה","screen structure — mockup")} · v3</div>`;
  h+=`</div>`;

  app.innerHTML=h;

  /* wire handlers */
  app.querySelectorAll("[data-sc]").forEach(b=>b.onclick=()=>{const s=catItem(state.shortcuts[+b.dataset.sc]);if(s)go(s);});
  const scEdit=document.getElementById("sc-edit");if(scEdit)scEdit.onclick=openEdit;
  const scEdit2=document.getElementById("sc-edit2");if(scEdit2)scEdit2.onclick=openEdit;
  const moreOpen=document.getElementById("more-open");if(moreOpen)moreOpen.onclick=()=>openMore(id);
  app.querySelectorAll("[data-c]").forEach(b=>b.onclick=()=>go(cfg.centers[+b.dataset.c]));
  app.querySelectorAll("[data-cn]").forEach(s=>s.onclick=()=>goToStack(+s.dataset.cn));
  app.querySelectorAll("[data-ex]").forEach(b=>b.onclick=()=>{state.exchange=cfg.exchangeGrid[+b.dataset.ex].name;render();});
  app.querySelectorAll("[data-tog]").forEach(b=>b.onclick=()=>{const k=b.dataset.tog;state.toggles[k]=!state.toggles[k];render();});
  app.querySelectorAll("[data-view]").forEach(b=>b.onclick=()=>{state.viewMode=b.dataset.view;render();});
  app.querySelectorAll("[data-pmode]").forEach(b=>b.onclick=()=>{state.pnlMode=b.dataset.pmode;render();});
  app.querySelectorAll("[data-li]").forEach(b=>b.onclick=()=>{const it=list.items[+b.dataset.li];
    if(list.kind==="account"){state.account=it.key;render();return;}
    if(it.to)nav(it.to);else if(it.act==="lang")toggleLang();});

  renderTabBar();
}

/* render the MAIN list as rows OR tiles (both fully working) */
function renderList(list,view){
  const accActive=it=>list.kind==="account"&&state.account===it.key;
  if(view==="tiles"){
    let h=`<div class="tiles">`;
    list.items.forEach((it,i)=>{
      const on=accActive(it);
      const ico=it.badge!=null?`<span class="tico">${it.badge}</span>`:`<span class="tico"${on?' style="background:var(--accent-grad);color:var(--btn-ink)"':''}>${ic(it.ico||"dot",18)}</span>`;
      const chipTone=list.kind==="account"?(on?"gain":"gold"):it.tone;
      const chipText=list.kind==="account"?(on?tt("פעיל","Active"):tt("בחר","Select")):(it.chip?L(it.chip):"");
      const chip=chipText?`<span class="rchip" style="${toneChip(chipTone)};position:absolute;top:9px;inset-inline-end:9px">${chipText}</span>`:"";
      h+=`<button class="tile" data-li="${i}" style="position:relative;${on?"border-color:var(--gold)":""}">${chip}${ico}<span class="tt">${L(it.t)}</span>${it.m?`<span class="ts">${L(it.m)}</span>`:""}</button>`;
    });
    return h+`</div>`;
  }
  let h=`<div class="rows">`;
  list.items.forEach((it,i)=>{
    const on=accActive(it);
    const ico=it.badge!=null?`<span class="rico">${it.badge}</span>`:`<span class="rico"${on?' style="background:var(--accent-grad);color:var(--btn-ink)"':''}>${ic(it.ico||"dot",18)}</span>`;
    let chip="";
    if(list.kind==="account")chip=`<span class="rchip" style="${toneChip(on?"gain":"gold")}">${on?tt("פעיל","Active"):tt("בחר","Select")}</span>`;
    else if(it.chip)chip=`<span class="rchip" style="${toneChip(it.tone)}">${L(it.chip)}</span>`;
    const arrow=list.kind!=="account"?`<span class="rarrow">${ic("arrow",16)}</span>`:"";
    h+=`<button class="row" data-li="${i}" style="${on?"border-color:var(--gold)":""}">${ico}<span class="rmid"><span class="rt">${L(it.t)}</span>${it.m?`<span class="rm">${L(it.m)}</span>`:""}</span>${chip}${arrow}</button>`;
  });
  return h+`</div>`;
}

/* real bottom TAB BAR — always present, highlights the active section */
function renderTabBar(){
  const el=document.getElementById("tabbar");
  const act=tabFor(state.stack[state.stack.length-1]);
  el.innerHTML=TABS.map(t=>`<button data-tab="${t.key}" class="${t.key===act?"on":""}"><span class="tacc"></span>${ic(t.ico,21)}<span class="tlab">${L(t.lab)}</span></button>`).join("");
  el.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>navTab(b.dataset.tab));
}
function navTab(key){const t=TABS.find(x=>x.key===key);
  state.stack=key==="home"?["home"]:["home",t.to];render();window.scrollTo(0,0);}

/* the "More settings" child = the parent screen's extras as a grid */
function openMore(parentId){state.moreParent=parentId;nav("more");}

/* ── SHORTCUTS EDIT SHEET (pick your 5) ─────────────────────────────────────── */
function openEdit(){state.editOpen=true;renderOverlay();}
function closeEdit(){state.editOpen=false;renderOverlay();}
function toggleSc(id){const i=state.shortcuts.indexOf(id);
  if(i>=0)state.shortcuts.splice(i,1);
  else if(state.shortcuts.length<MAX_SHORTCUTS)state.shortcuts.push(id);
  renderOverlay();render();}
function renderOverlay(){
  const o=document.getElementById("overlay");
  if(!state.editOpen){o.innerHTML="";return;}
  let h=`<div class="ovl" id="ovl-bg"><div class="ovlcard">`;
  h+=`<div class="ovlhead"><h3>${tt("הקיצורים שלי","My shortcuts")}</h3><button class="done" id="ovl-done">${tt("סיום","Done")}</button></div>`;
  h+=`<p class="ovlsub">${tt(`בחרו עד 5 קיצורים שיופיעו בראש כל מסך (${state.shortcuts.length}/5).`,`Pick up to 5 shortcuts shown atop every screen (${state.shortcuts.length}/5).`)}</p>`;
  h+=`<div class="ovlgrid">`;
  SHORTCUT_CATALOG.forEach(s=>{
    const sel=state.shortcuts.includes(s.id);
    const dis=!sel&&state.shortcuts.length>=MAX_SHORTCUTS;
    h+=`<button class="ovlopt ${sel?"sel":""} ${dis?"dis":""}" data-opt="${s.id}"><span class="oico">${ic(s.ico,16)}</span><span>${L(s.lab)}</span>${sel?`<span class="ochk">${ic("check",16)}</span>`:""}</button>`;
  });
  h+=`</div></div></div>`;
  o.innerHTML=h;
  document.getElementById("ovl-done").onclick=closeEdit;
  document.getElementById("ovl-bg").onclick=e=>{if(e.target.id==="ovl-bg")closeEdit();};
  o.querySelectorAll("[data-opt]").forEach(b=>b.onclick=()=>{if(!b.classList.contains("dis"))toggleSc(b.dataset.opt);});
}

function goToStack(i){state.stack=state.stack.slice(0,i+1);render();window.scrollTo(0,0);}
window.back=back;window.goToStack=goToStack;

/* ── CONTROL DOCK ───────────────────────────────────────────────────────────── */
function buildDock(){
  /* role segment */
  const roles=[["user",T("משתמש","User")],["employee",T("עובד","Employee")],["owner",T("בעלים","Owner")]];
  const segRole=document.getElementById("seg-role");
  segRole.innerHTML=roles.map(r=>`<button data-role="${r[0]}" class="${state.role===r[0]?'on':''}">${L(r[1])}</button>`).join("");
  segRole.querySelectorAll("button").forEach(b=>b.onclick=()=>{
    state.role=b.dataset.role;
    /* reset to home if current screen is now gated away */
    const id=state.stack[state.stack.length-1];
    if((id==="owners"||id.startsWith("owners-"))&&state.role!=="owner")state.stack=["home"];
    if(id==="portals-others"&&state.role==="user")state.stack=["home"];
    render();buildDock();
  });
  /* skins */
  const skins=document.getElementById("skins");
  skins.innerHTML=Object.keys(PALETTES).map(k=>{
    const p=PALETTES[k][state.mode];
    return`<button class="sw ${state.skin===k?'on':''}" data-skin="${k}" style="background:linear-gradient(135deg,${p.fan[0]},${p.gold},${p.fan[p.fan.length-1]})">${PALETTES[k].label}</button>`;
  }).join("");
  skins.querySelectorAll("button").forEach(b=>b.onclick=()=>{state.skin=b.dataset.skin;applyTheme();render();buildDock();});
  /* labels + buttons */
  document.getElementById("lab-role").textContent=tt("תפקיד","Role");
  document.getElementById("lab-skin").textContent=tt("מראה","Skin");
  document.getElementById("btn-lang").textContent=state.lang==="he"?"EN":"עב";
  document.getElementById("btn-mode").textContent=state.mode==="dark"?"☀":"☾";
  document.getElementById("mockflag").textContent=tt("Mockup · הדגמה בלבד — לא האפליקציה האמיתית","Mockup · demo only — not the real app");
}
function toggleLang(){state.lang=state.lang==="he"?"en":"he";
  document.documentElement.lang=state.lang;document.documentElement.dir=state.lang==="he"?"rtl":"ltr";
  render();buildDock();}
document.getElementById("btn-lang").onclick=toggleLang;
document.getElementById("btn-mode").onclick=()=>{state.mode=state.mode==="dark"?"light":"dark";applyTheme();render();buildDock();};
document.getElementById("btn-flip").onclick=()=>{state.homePrimary=state.homePrimary==="trading"?"portal":"trading";
  /* jump to home so Dan sees the effect immediately */
  state.stack=["home"];render();};

/* ── BOOT ───────────────────────────────────────────────────────────────────── */
applyTheme();buildDock();render();
</script>
</body>
</html>
