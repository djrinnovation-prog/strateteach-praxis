[project]
name = "algo770-strateteach"
version = "1.0.0"
description = "770 Trend Diamonds — multi-asset Gaussian-channel breakout scanner + backtester"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.136.0",
    "uvicorn[standard]>=0.48.0",
    "pydantic>=2.13.0",
    "psycopg[binary]>=3.3.0",
    "python-multipart>=0.0.29",
    "httpx>=0.28.0",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "scipy>=1.13.0",
    "yfinance>=0.2.40",
    "ccxt>=4.5.0",
    "aiofiles>=24.1.0",
    "apscheduler>=3.10.0",
    "cryptography>=43.0.0",
    "openpyxl>=3.1.0",
    "weasyprint>=62.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "pytest-asyncio>=0.24.0"]

[tool.pytest.ini_options]
testpaths = ["python-backend/tests"]
pythonpath = ["python-backend"]
asyncio_mode = "auto"
